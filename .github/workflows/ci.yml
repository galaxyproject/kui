name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: gcp-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run validate-snapshots
      - run: npm test
      - run: npm run test:gxrdb
      - run: npm run check
      - run: npm run build
